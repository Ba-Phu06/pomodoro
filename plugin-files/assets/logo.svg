<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pomoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Tomato Body with 10% margin (10 to 90) -->
  <circle cx="50" cy="54" r="36" fill="url(#pomoGrad)" filter="url(#subtleShadow)" />

  <!-- Clock dial ring inside tomato -->
  <circle cx="50" cy="54" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5" />

  <!-- 25-minute arc highlight -->
  <path d="M 50 30 A 24 24 0 0 1 67 71" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Clock hands (25 minute mark) -->
  <line x1="50" y1="54" x2="50" y2="36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="54" x2="65" y2="62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="54" r="3" fill="#FFFFFF" />

  <!-- Stem and Leaves -->
  <path d="M 50 18 Q 50 12 55 10" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" />
  <path d="M 50 20 C 42 16 35 22 41 27 C 46 25 48 22 50 20 Z" fill="url(#leafGrad)" />
  <path d="M 50 20 C 58 16 65 22 59 27 C 54 25 52 22 50 20 Z" fill="url(#leafGrad)" />
  <ellipse cx="50" cy="21" rx="4" ry="2.5" fill="#059669" />
</svg>
